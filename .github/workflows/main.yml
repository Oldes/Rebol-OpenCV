name: 'Rebol-OpenCV CI'
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
    paths:
      - src/**
      - test.r3
      - Rebol-OpenCV.nest

  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: true
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1

    - name: Set Siskin locations
      shell: bash
      run: |
        echo "SISKIN_TEMP=$RUNNER_TEMP/siskin"      >> "$GITHUB_ENV"
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
        echo "REBOL_MODULES_DIR=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"

    - name: Cache OpenCV install
      id: opencv
      uses: actions/cache@v4
      with:
        path: ${{ env.SISKIN_INSTALL }}
        key: opencv-5.0.0-${{ runner.os }}-${{ job.name }}-${{ hashFiles('Rebol-OpenCV.nest') }}

    - name: Build OpenCV static libraries
      if: steps.opencv.outputs.cache-hit != 'true'
      run: ./siskin Rebol-OpenCV.nest cmake-opencv-static-x64

    - name: Build 64bit Rebol OpenCV extension
      run: ./siskin Rebol-OpenCV.nest -o ./build/opencv-static-abi1-x64.rebx --msvc opencv-static-windows-x64

    - name: Test extension
      run:  ./siskin --script test.r3 --static

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-OpenCV-Windows-${{github.run_id}}
        path: ./build/*.rebx

  linux:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1

    - name: Set Siskin locations
      shell: bash
      run: |
        echo "SISKIN_TEMP=$RUNNER_TEMP/siskin"      >> "$GITHUB_ENV"
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
        echo "REBOL_MODULES_DIR=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"

    - name: Cache OpenCV install
      id: opencv
      uses: actions/cache@v4
      with:
        path: ${{ env.SISKIN_INSTALL }}
        key: opencv-5.0.0-${{ runner.os }}-${{ job.name }}-${{ hashFiles('Rebol-OpenCV.nest') }}

    - name: Build OpenCV static libraries
      if: steps.opencv.outputs.cache-hit != 'true'
      run: ./siskin Rebol-OpenCV.nest cmake-opencv-static-x64

    - name: Build 64bit Rebol OpenCV extension
      run: ./siskin Rebol-OpenCV.nest --gzip -o ./build/opencv-static-abi1-x64.rebx opencv-static-linux-x64

#    - name: Setup library location
#      run: |
#        sudo ldconfig /usr/local/lib
#        sudo ldconfig -v
#        ldd -v ./build/opencv-static-abi1-x64.rebx

    - name: Test extension
      run:  ./siskin --script test.r3 --static

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-OpenCV-Linux-${{github.run_id}}
        path: ./build/*.rebx.gz

  macos-intel:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1

    - name: Set Siskin locations
      shell: bash
      run: |
        echo "SISKIN_TEMP=$RUNNER_TEMP/siskin"      >> "$GITHUB_ENV"
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
        echo "REBOL_MODULES_DIR=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"

    - name: Cache OpenCV install
      id: opencv
      uses: actions/cache@v4
      with:
        path: ${{ env.SISKIN_INSTALL }}
        key: opencv-5.0.0-${{ runner.os }}-${{ job.name }}-${{ hashFiles('Rebol-OpenCV.nest') }}

    - name: Build OpenCV static libraries
      if: steps.opencv.outputs.cache-hit != 'true'
      run: ./siskin Rebol-OpenCV.nest cmake-opencv-static-x64

    - name: Build 64bit Rebol OpenCV extension
      run: ./siskin Rebol-OpenCV.nest --gzip -o ./build/opencv-static-abi1-x64.rebx opencv-static-macos-x64

    - name: Test extension
      run:  ./siskin --script test.r3 --static

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-OpenCV-macos-intel-${{github.run_id}}
        path: ./build/*.rebx.gz

  macos-arm:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.23.1
      with:
        arch: aarch64

    - name: Set Siskin locations
      shell: bash
      run: |
        echo "SISKIN_TEMP=$RUNNER_TEMP/siskin"      >> "$GITHUB_ENV"
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
        echo "REBOL_MODULES_DIR=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"

    - name: Cache OpenCV install
      id: opencv
      uses: actions/cache@v4
      with:
        path: ${{ env.SISKIN_INSTALL }}
        key: opencv-5.0.0-${{ runner.os }}-${{ job.name }}-${{ hashFiles('Rebol-OpenCV.nest') }}

    - name: Build OpenCV static libraries
      if: steps.opencv.outputs.cache-hit != 'true'
      run: ./siskin Rebol-OpenCV.nest cmake-opencv-static-arm64

    - name: Build 64bit Rebol OpenCV extension
      run: ./siskin Rebol-OpenCV.nest --gzip -o ./build/opencv-static-abi1-arm64.rebx opencv-static-macos-arm64

    - uses: actions/upload-artifact@v6
      with:
        name: Rebol-OpenCV-macos-arm-${{github.run_id}}
        path: ./build/*.rebx.gz